[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awaybox"
version = "0.1.0"
description = "A lightweight, persistent IRC mailbox and Telegram relay service"
readme = "README.md"
authors = [
    { name = "TonsHans" }
]
license = { text = "MIT License" }
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
awaybox = "awaybox.main:main"

[tool.setuptools.packages.find]
where = ["awaybox"]
